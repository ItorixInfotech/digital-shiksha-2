# Single server: static frontend (yarn build → dist/) + FastAPI on 127.0.0.1:8001
server {
    listen 80;
    server_name www.digitalshiksha.in digitalshiksha.in;
    root /var/www/digital-shiksha/dist;
    client_max_body_size 20m;   # Excel cutoff uploads

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8001/api/sitemap.xml; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8001/api/robots.txt;  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; }   # SPA routes: /colleges/..., /engineering-colleges-in-pune, /admin
}
# Add HTTPS with: sudo certbot --nginx -d www.digitalshiksha.in -d digitalshiksha.in
